<!DOCTYPE html>
<html>
<head>
    <title>MSP Quiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial;
            text-align: center;
            padding: 30px;
        }

        .quiz-box {
            max-width: 500px;
            margin: auto;
        }

        input, button {
            padding: 12px;
            margin: 8px;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="quiz-box">

    <h1>OMG!! Welcome to MSP Quiz!</h1>

    <div id="start">
        <input id="name" placeholder="Enter your name">
        <br>
        <button onclick="startQuiz()">Start Quiz</button>
    </div>

    <div id="quiz" style="display:none;">
        <h2 id="question"></h2>

        <input id="answer" placeholder="Type your answer">
        <br>

        <button onclick="nextQuestion()">Next</button>

        <p id="score"></p>
    </div>

    <div id="result" style="display:none;"></div>

</div>

<script>

let playerName = "";
let currentQuestion = 0;
let score = 0;

const questions = [
    {
        question: "What's 2 + 2?",
        answers: ["4"]
    },
    {
        question: "What's 100 × 100?",
        answers: ["10000", "10,000"]
    },
    {
        question: "What's a verb?",
        answers: ["action", "doing"]
    },
    {
        question: "If all cats are animals and Bullet is a cat, then Bullet is an?",
        answers: ["animal"]
    },
    {
        question: "What's the largest organ in the human body?",
        answers: ["skin"]
    },
    {
        question: "What's the biggest ocean in the world?",
        answers: ["pacific", "pacific ocean"]
    },
    {
        question: "If A=1, B=2, C=3... what is CAT?",
        answers: ["3-1-20", "3,1,20"]
    }
];

function startQuiz() {

    playerName = document.getElementById("name").value;

    if (playerName === "") {
        alert("Please enter your name!");
        return;
    }

    document.getElementById("start").style.display = "none";
    document.getElementById("quiz").style.display = "block";

    showQuestion();
}

function showQuestion() {

    document.getElementById("question").innerText =
        questions[currentQuestion].question;

    document.getElementById("answer").value = "";

    document.getElementById("score").innerText =
        "Score: " + score;
}

function nextQuestion() {

    let answer = document.getElementById("answer").value
        .toLowerCase()
        .trim();

    let correctAnswers = questions[currentQuestion].answers;

    if (correctAnswers.includes(answer)) {
        score++;
        alert("Correct! 🎉");
    } else {
        alert("Wrong!");
    }

    currentQuestion++;

    if (currentQuestion < questions.length) {
        showQuestion();
    } else {
        finishQuiz();
    }
}

function finishQuiz() {

    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    let message;

    if (score >= 5) {
        message = "Wow!! You are a brainful, you win!!! 🏆";
    } else if (score >= 3) {
        message = "Nice, keep pushing till you win!! 💪";
    } else if (score >= 1) {
        message = "Never give up!! You will do more next time!";
    } else {
        message = "Better luck next time, never give up!";
    }

    document.getElementById("result").innerHTML =
        "<h2>Well done " + playerName + "!</h2>" +
        "<h2>Your score: " + score + "/" + questions.length + "</h2>" +
        "<p>" + message + "</p>" +
        "<button onclick='location.reload()'>Play Again</button>";
}

</script>

</body>
  </html>
